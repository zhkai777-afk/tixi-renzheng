    .layout{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:12px 16px;overflow:hidden}

<body>
<div class="app">
  <header class="topbar">
    <div class="top-left">
      <button class="back" type="button" id="backBtn" aria-label="返回认证决定审批列表">← 返回</button><span class="divider"></span>
      <div class="heading"><div class="title-row"><span class="title">认证决定审批详情</span><span class="tag pending" id="headerStatus">待审批</span></div><div class="meta"><span id="taskNoText">TASK-2026-001</span> · <span id="customerText">客户A</span> · <span id="certTypeText">初次认证</span></div></div>
    </div>
    <div class="top-actions"><span class="tag gray">待领导审批</span></div>
  </header>

  <main class="layout" id="mainContent">
    <section class="decision-card" aria-labelledby="decisionSectionTitle">
      <div class="section-head"><h2 id="decisionSectionTitle">认证决定</h2></div>
      <div class="decision-layout" id="decisionSummary"></div>
    </section>

    <section class="cert-card" aria-labelledby="certificateSectionTitle">
      <div class="section-head"><div><h2 id="certificateSectionTitle">证书列表</h2><div class="section-desc">本领域共 <span class="cert-count" id="certificateCount">0</span> 张相关证书</div></div><span class="tag gray">仅供审批核对</span></div>
      <div class="table-scroll"><table><thead><tr><th style="width:60px">序号</th><th style="width:250px">证书标题</th><th style="width:180px">证书编号</th><th style="width:120px">认可机构</th><th style="width:280px">符合标准</th><th>认证范围</th></tr></thead><tbody id="certificateTableBody"></tbody></table></div>
    </section>

    <section class="material-card" aria-labelledby="materialSectionTitle">
      <div class="section-head"><h2 id="materialSectionTitle">归档材料清单</h2><span class="tag gray" id="fileTotal">19个文件</span></div>
      <div class="material-layout">
        <aside class="material-sidebar" aria-label="审批佐证材料导航">
          <div class="left-controls"><div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="materialSearch" type="search" placeholder="搜索材料名称" autocomplete="off"></div><div class="quick" id="quickFilters"><button class="quick-btn active" data-filter="all" type="button">全部</button><button class="quick-btn" data-filter="evidence" type="button">决定依据</button><button class="quick-btn" data-filter="files" type="button">已带入</button></div></div>
          <div class="tree" id="materialTree"></div>
        </aside>
        <div class="material-content"><div class="material-content-inner" id="dynamicContent"></div></div>
      </div>
    </section>
  </main>
</div>

<div class="modal-layer" id="approvalModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal"><div class="modal-head"><div class="modal-title" id="modalTitle">审批确认</div><button class="icon-btn" id="modalClose" type="button" aria-label="关闭">×</button></div><div class="modal-body"><div class="modal-alert" id="modalAlert"></div><div class="form-item"><label for="approvalOpinion" id="opinionLabel">审批意见</label><textarea id="approvalOpinion" placeholder="请输入审批意见"></textarea><div class="hint" id="opinionHint"></div><div class="error" id="opinionError" role="alert"></div></div></div><div class="modal-foot"><button class="btn" id="modalCancel" type="button">取消</button><button class="btn btn-primary" id="modalConfirm" type="button">确认</button></div></div>
</div>
<div class="modal-layer" id="previewModal" role="dialog" aria-modal="true" aria-labelledby="previewTitle"><div class="modal"><div class="modal-head"><div class="modal-title" id="previewTitle">文件预览</div><button class="icon-btn" id="previewClose" type="button" aria-label="关闭">×</button></div><div class="modal-body"><div class="modal-alert" style="border-color:#b7d3ff;background:#f5f9ff;color:#174ea6">当前为原型页面，已模拟打开文件。</div><div style="margin-top:16px;font-size:15px;font-weight:600" id="previewName"></div><div class="hint" style="margin-top:7px">文件仅作为材料清单项下的佐证附件，认证决定结论落在任务和体系级别。</div></div><div class="modal-foot"><button class="btn btn-primary" id="previewOk" type="button">关闭预览</button></div></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const materials=[
['001','通用材料','认证发证推荐表','QESF'],['002','通用材料','证书内容确认件（标黄代表需要pdf附件）','QESF'],['003','通用材料','认证申请表','QESF'],['004','通用材料','全国认证认可信息公共服务平台(认e云)查询截图','QESF'],

materialTree.addEventListener('click',e=>{const b=e.target.closest('[data-material]');if(!b)return;selected=b.dataset.material;renderTree();renderMain();if(innerWidth<761)mainContent.scrollIntoView({behavior:'smooth'})});materialSearch.addEventListener('input',renderTree);quickFilters.addEventListener('click',e=>{const b=e.target.closest('[data-filter]');if(!b)return;quickFilter=b.dataset.filter;quickFilters.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));renderTree()});backBtn.addEventListener('click',()=>location.href='./认证决定审批管理.html');modalClose.addEventListener('click',closeApproval);modalCancel.addEventListener('click',closeApproval);modalConfirm.addEventListener('click',submitApproval);approvalModal.addEventListener('click',e=>{if(e.target===approvalModal)closeApproval()});previewClose.addEventListener('click',closePreview);previewOk.addEventListener('click',closePreview);previewModal.addEventListener('click',e=>{if(e.target===previewModal)closePreview()});document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeApproval();closePreview()}});
updateHeader();renderDecisionSummary();renderCertificates();renderTree();renderMain();
